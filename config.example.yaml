# Copy to config.yaml and edit. Secrets go in .env / GitHub Actions secrets, NOT here.

llm:
  model: claude-sonnet-5        # used for transcript cleaning + brain-dump routing

slack:
  lookback_days: 8
  # search.messages queries. after:<date> is appended automatically.
  #   from:@me            -> messages you sent
  #   @yourhandle         -> mentions of you (replace with your handle)
  #   to:@me              -> DMs to you
  search_queries:
    - "from:@me"
    - "@yourhandle"
    - "to:@me"
  action_keywords:   ["can you", "please", "todo", "action item", "follow up", "by eod", "deadline", "?"]
  feedback_keywords: ["great job", "well done", "thank you", "concerned", "disappointed", "issue with", "feedback"]

email:
  lookback_days: 8
  feedback_keywords: ["feedback", "great work", "well done", "concern", "unhappy", "follow up", "review"]
